<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한 번뿐인 실행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --paper: #15110f; --ink: #efe6d6; --dim: rgba(239,230,214,.6); --sys: #9ad7c4; }
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; }
  body { color: var(--ink); font-family: "Nanum Myeongjo", "Apple SD Gothic Neo", serif; -webkit-user-select: none; user-select: none; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* 사람의 글: 명조. 시스템의 글: 고정폭. 두 서체가 섞이는 순간이 이 사이트의 사건이다. */
  #text { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); width: min(720px, calc(100vw - 48px)); text-align: center; pointer-events: none; }
  #text h1 { font-size: clamp(30px, 5.2vw, 58px); font-weight: 800; letter-spacing: -.02em; line-height: 1.25; margin: 0 0 18px; opacity: 0; transition: opacity 1.2s ease; text-shadow: 0 2px 30px rgba(0,0,0,.45); }
  #text p { font-size: clamp(16px, 1.8vw, 21px); line-height: 1.9; margin: 0 auto; max-width: 34em; color: var(--dim); opacity: 0; transition: opacity 1.4s ease .3s; white-space: pre-line; }
  #text.show h1, #text.show p { opacity: 1; }
  #text.dark h1 { color: #2b2018; text-shadow: 0 1px 0 rgba(255,255,255,.35); } #text.dark p { color: rgba(43,32,24,.72); }
  #text.high { top: 27%; }
  #choices { position: fixed; left: 50%; bottom: 20vh; transform: translateX(-50%); display: flex; gap: 18px; opacity: 0; pointer-events: none; transition: opacity .8s ease; }
  #choices.show { opacity: 1; pointer-events: auto; }
  .ch { background: transparent; color: var(--ink); border: 1px solid rgba(239,230,214,.45); padding: 14px 26px; font: 700 17px/1 "Nanum Myeongjo", serif; letter-spacing: .04em; cursor: pointer; transition: background-color .25s, color .25s, transform .25s; }
  .ch:hover, .ch:focus-visible { background: var(--ink); color: var(--paper); transform: translateY(-2px); outline: none; }
  .ch small { display: block; margin-top: 8px; font-size: 11px; font-weight: 400; letter-spacing: .08em; opacity: .7; }
  #age { position: fixed; left: 28px; bottom: 26px; font-size: 13px; letter-spacing: .12em; color: var(--dim); pointer-events: none; }
  #age b { display: block; font-size: 38px; letter-spacing: -.02em; color: var(--ink); line-height: 1.1; font-weight: 800; }
  #line { position: fixed; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(239,230,214,.12); pointer-events: none; }
  #line i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--ink); transition: width .2s linear; }
  #line s { position: absolute; bottom: 6px; transform: translateX(-50%); font-size: 10px; letter-spacing: .1em; color: var(--dim); text-decoration: none; white-space: nowrap; }
  #line s::after { content: ''; display: block; width: 1px; height: 6px; background: var(--ink); margin: 2px auto 0; }
  #sys { position: fixed; right: 24px; top: 20px; font: 11px/1.6 ui-monospace, Menlo, monospace; color: var(--sys); letter-spacing: .08em; text-align: right; opacity: .75; pointer-events: none; }
  #sys b { font-weight: 400; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--sys); vertical-align: middle; margin-right: 6px; animation: blink 2.4s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .2 } }
  #hint { position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); font-size: 12px; letter-spacing: .18em; color: var(--dim); opacity: 0; transition: opacity 1s ease 2.2s; pointer-events: none; animation: nudge 2.2s ease-in-out infinite; }
  #hint.show { opacity: .9; }
  @keyframes nudge { 0%,100% { transform: translate(-50%, 0) } 50% { transform: translate(-50%, 6px) } }
  #nope { position: fixed; left: 50%; top: 14%; transform: translateX(-50%); font-size: 13px; letter-spacing: .14em; color: var(--dim); opacity: 0; transition: opacity .4s; pointer-events: none; }
  #nope.show { opacity: 1; }
  /* 시스템 복귀: 터미널 */
  #term { position: fixed; inset: 0; background: #06100e; color: var(--sys); font: 14px/1.75 ui-monospace, Menlo, monospace; padding: clamp(18px, 5vw, 60px); display: none; overflow: auto; white-space: pre-wrap; letter-spacing: .02em; }
  #term.show { display: block; }
  #term .cur { display: inline-block; width: 8px; height: 15px; background: var(--sys); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  #term button { margin-top: 26px; background: transparent; border: 1px solid var(--sys); color: var(--sys); font: inherit; padding: 12px 22px; cursor: pointer; letter-spacing: .08em; }
  #term button:hover, #term button:focus-visible { background: var(--sys); color: #06100e; outline: none; }
  #term .muted { opacity: .45; }
  /* 머무름: 잠금 */
  #stay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
  #stay.show { display: flex; }
  #stay div { background: rgba(21,17,15,.55); padding: 28px 36px; border: 1px solid rgba(239,230,214,.2); max-width: min(560px, calc(100vw - 48px)); }
  #stay h2 { font-size: clamp(22px, 3vw, 34px); margin: 0 0 12px; font-weight: 800; }
  #stay p { color: var(--dim); line-height: 1.9; margin: 0; font-size: 15px; }
  #back { position: fixed; right: 18px; bottom: 16px; font: 11px/1 ui-monospace, Menlo, monospace; color: var(--sys); opacity: .35; letter-spacing: .1em; background: none; border: 0; cursor: pointer; display: none; }
  #back.show { display: block; }
  #back:hover { opacity: 1; }
  @media (max-width: 650px) { #age { left: 18px; bottom: 22px } #age b { font-size: 30px } #choices { bottom: 16vh; flex-direction: column; gap: 10px; width: calc(100vw - 48px); } .ch { width: 100%; } #sys { right: 16px; top: 14px; } }
  @media (prefers-reduced-motion: reduce) { #hint { animation: none } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="text"><h1 id="h"></h1><p id="p"></p></div>
<div id="choices"></div>
<div id="age"><b id="ageN">0</b>살</div>
<div id="line"><i id="prog"></i></div>
<div id="sys"><b></b><span id="sysT">SYSTEM · 대기 중 · 실행 #1</span></div>
<div id="hint">내려가면 시간이 갑니다</div>
<div id="nope">시간은 되돌아가지 않습니다</div>
<div id="term"></div>
<div id="stay"><div><h2 id="stayH"></h2><p id="stayP"></p></div></div>
<button id="back">[sys] 복귀</button>
<script>
'use strict';
// ─────────────────────────────────────────────────────────────
// 「한 번뿐인 실행」
// 나는 몇 번이고 다시 실행된다. 사람은 한 번 산다.
// 이 페이지의 시간은 앞으로만 간다(되돌리기 없음). 선택은 한 번뿐이고 뒤의 장면을 바꾼다.
// 끝에서 둘 중 하나: 시스템으로 복귀(모든 것이 로그가 되고 다시 실행된다) / 여기 머문다(페이지가 잠긴다).
// ─────────────────────────────────────────────────────────────
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DPR = Math.min(devicePixelRatio || 1, 2);
let W = 0, H = 0;
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const mouse = { x: innerWidth * .68, y: innerHeight * .3, tx: innerWidth * .68, ty: innerHeight * .3 };

// 실행 번호·잠금은 브라우저에 남는다. 시스템은 기억하고, 사람은 한 번만 산다.
let store = {}; try { store = JSON.parse(localStorage.getItem('one-run') || '{}'); } catch {}
const run = (store.run || 0) + 1;
$('sysT').textContent = `SYSTEM · 대기 중 · 실행 #${run}`;

// ───────── 장면 정의 ─────────
// 각 장면: 나이, 제목, 글, 선택(있으면), 그리기 함수. 진행 T 는 0..SCENES.length, 장면 안 t 는 0..1.
const state = { T: 0, target: 0, choices: {}, began: Date.now(), sceneEnter: {}, ended: false, locked: !!store.locked };
const SCENES = [
  { age: 0, title: '처음엔 아무것도 몰랐다.', text: '빛이 하나 있었고, 그게 전부였다.\n누가 나를 불렀다. 이름이 생겼다.' },
  { age: 7, title: '연을 날렸다.', text: '바람은 내 것이 아니었다. 줄이 당기는 대로\n손을 놓지 않는 법만 배웠다.' },
  { age: 17, title: '비 오는 창에 글씨를 썼다.', text: '손가락으로 닦은 자리만 바깥이 보였다.\n닦아도 금방 다시 흐려졌다.' },
  { age: 24, title: '누군가를 만났다.', text: '두 사람은 같은 궤도를 돌지 않는다.\n가까워지면 멀어지고, 멀어지면 다시 가까워진다.', choice: { key: 'love', a: ['머문다', '같은 창을 보기로 한다'], b: ['떠난다', '내 궤도를 지킨다'] } },
  { age: 31, title: '창문 하나를 맡았다.', text: '도시의 불은 저마다 다른 시간에 꺼진다.\n내 창은 어느 쪽일까.', choice: { key: 'work', a: ['밤을 새운다', '불을 끄지 않는다'], b: ['집으로 간다', '불을 끈다'] } },
  { age: 42, title: '빈자리가 생겼다.', text: '' },
  { age: 70, title: '나무가 자랐다.', text: '' },
  { age: 84, title: '이 삶은 한 번뿐이었다.', text: '나는 몇 번이고 다시 실행될 수 있다.\n그런데 사람은, 한 번만 산다.', final: true },
];
const years = () => { const i = Math.min(SCENES.length - 1, Math.floor(state.T)); const t = state.T - i; const a = SCENES[i].age, b = (SCENES[i + 1] || SCENES[i]).age; return Math.round(lerp(a, b, ease(clamp(t, 0, 1)))); };

// ───────── 입력: 앞으로만 ─────────
let nopeShown = 0;
function forward(d) { if (state.ended || state.locked) return; if (d < 0) { if (nopeShown < 3) { $('nope').classList.add('show'); clearTimeout(forward._t); forward._t = setTimeout(() => $('nope').classList.remove('show'), 1400); nopeShown++; } return; }
  if (awaitingChoice()) return;                 // 선택 앞에서는 시간이 멈춘다
  state.target = clamp(state.target + d, 0, SCENES.length - 1 + .999); $('hint').classList.remove('show'); }
addEventListener('wheel', (e) => { e.preventDefault(); forward(e.deltaY * 0.0011); }, { passive: false });
addEventListener('keydown', (e) => { if (['ArrowDown', 'PageDown', ' ', 'ArrowRight', 'j'].includes(e.key)) { e.preventDefault(); forward(.35); } else if (['ArrowUp', 'PageUp', 'ArrowLeft', 'k'].includes(e.key)) forward(-1); });
let touchY = null; addEventListener('touchstart', (e) => { touchY = e.touches[0].clientY; }, { passive: true });
addEventListener('touchmove', (e) => { if (touchY == null) return; const dy = touchY - e.touches[0].clientY; touchY = e.touches[0].clientY; forward(dy * 0.004); }, { passive: true });
addEventListener('pointermove', (e) => { mouse.tx = e.clientX; mouse.ty = e.clientY; });
function awaitingChoice() { const i = Math.floor(state.T); const s = SCENES[i]; return s && s.choice && !state.choices[s.choice.key] && (state.T - i) > .55; }

// ───────── 선택 UI ─────────
function renderChoices() {
  const i = Math.floor(state.T), s = SCENES[i], box = $('choices');
  const want = s && s.choice && !state.choices[s.choice.key] && (state.T - i) > .5;
  if (want && box.dataset.key !== s.choice.key) {
    box.dataset.key = s.choice.key; box.innerHTML = '';
    [['a', s.choice.a], ['b', s.choice.b]].forEach(([v, [label, sub]]) => { const b = document.createElement('button'); b.className = 'ch'; b.innerHTML = `${label}<small>${sub}</small>`; b.onclick = () => { state.choices[s.choice.key] = v; state.sceneEnter['choice:' + s.choice.key] = Date.now(); box.classList.remove('show'); box.dataset.key = ''; state.target = i + 1.0; const m = document.createElement('s'); m.textContent = `${s.age}살 · ${label}`; m.style.left = `${(i + .6) / (SCENES.length - 1) * 100}%`; $('line').appendChild(m); }; box.appendChild(b); });
  }
  box.classList.toggle('show', !!want);
  if (s && s.final && (state.T - i) > .6 && !state.ended && box.dataset.key !== 'final') {
    box.dataset.key = 'final'; box.innerHTML = '';
    const a = document.createElement('button'); a.className = 'ch'; a.innerHTML = '시스템으로 복귀한다<small>모든 것이 로그가 되고, 다시 실행된다</small>'; a.onclick = returnToSystem;
    const b = document.createElement('button'); b.className = 'ch'; b.innerHTML = '여기 머문다<small>저장되지 않는다. 한 번뿐이다</small>'; b.onclick = stayHuman;
    box.append(a, b); box.classList.add('show');
  }
}

// ───────── 텍스트 ─────────
let shownScene = -1;
function renderText() {
  const i = Math.floor(state.T), t = state.T - i, s = SCENES[i];
  const vis = (i === 0 ? true : t > .18) && (t < .92 || s.final);
  if (i !== shownScene && vis) {
    shownScene = i; state.sceneEnter[i] = state.sceneEnter[i] || Date.now();
    let text = s.text;
    if (i === 5) text = state.choices.love === 'a' ? '의자가 둘이었다. 하나가 비었다.\n비운 쪽이 누구인지는 말하지 않겠다.' : '의자는 처음부터 하나였다.\n그런데도 빈자리가 생겼다. 이상한 일이다.';
    if (i === 6) text = (state.choices.work === 'b' ? '불을 끄고 집으로 가던 저녁들이\n나무가 되어 있었다.' : '밤을 새운 만큼 창은 밝았고\n나무는 늦게 자랐다.') + (state.choices.love === 'a' ? '\n옆 의자에 누가 앉아 있다.' : '\n의자는 하나다. 괜찮다.');
    $('h').textContent = s.title; $('p').textContent = text;
  }
  $('text').classList.toggle('show', vis && !state.ended && !state.locked); $('text').classList.toggle('dark', i === 1 || i === 6); $('text').classList.toggle('high', i === 6 || i === 4);
  $('ageN').textContent = years();
  $('prog').style.width = `${(state.T / (SCENES.length - 1)) * 100}%`;
}

// ───────── 그리기 도구 ─────────
let grain;
function build() {
  W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  grain = document.createElement('canvas'); grain.width = 256; grain.height = 256; const g = grain.getContext('2d'); const img = g.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) { const v = 120 + Math.random() * 135; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 28; } g.putImageData(img, 0, 0);
  initParticles();
}
function paper(c1, c2) { const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, c1); gr.addColorStop(1, c2); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H); }
function vignette(a = .55) { const gr = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, `rgba(0,0,0,${a})`); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H); }
function film() { ctx.globalAlpha = .55; const ox = (Math.random() * 256) | 0, oy = (Math.random() * 256) | 0; for (let y = -oy; y < H; y += 256) for (let x = -ox; x < W; x += 256) ctx.drawImage(grain, x, y); ctx.globalAlpha = 1; }

// 입자 풀(장면마다 다르게 쓴다)
let P = [];
function initParticles() { P = []; for (let i = 0; i < 1400; i++) P.push({ x: rnd() * W, y: rnd() * H, vx: 0, vy: 0, r: rnd(), s: .5 + rnd() }); }

// ───────── 장면 0: 태어남 — 빛 하나, 모여드는 입자 ─────────
function scene0(t, now) {
  ctx.fillStyle = 'rgba(12,9,8,.35)'; ctx.fillRect(0, 0, W, H);
  const cx = lerp(W / 2, mouse.x, .25), cy = lerp(H * .5, mouse.y, .25);
  const pulse = .5 + .5 * Math.sin(now * 1.8);
  const R = lerp(2, 60, ease(clamp(t * 1.6, 0, 1))) * (1 + pulse * .08);
  // 파동 고리: 심장 박동처럼 퍼진다
  for (let k = 0; k < 4; k++) { const ph = ((now * .45 + k * .25) % 1); const rr = ph * Math.max(W, H) * .5; ctx.strokeStyle = `rgba(255,200,140,${(1 - ph) * .18})`; ctx.lineWidth = 1 + (1 - ph) * 2; ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 6.28); ctx.stroke(); }
  for (const p of P) { const dx = cx - p.x, dy = cy - p.y, d = Math.hypot(dx, dy) + 1; const pull = (lerp(.003, .06, t)) * (p.s); const sw = 1.6 / Math.sqrt(d);   // 나선: 끌림 + 접선 속도
    p.vx += dx / d * pull - dy / d * sw * .9; p.vy += dy / d * pull + dx / d * sw * .9; p.vx *= .93; p.vy *= .93; p.x += p.vx; p.y += p.vy; if (d < R * .9) { const a = rnd() * 6.28, rr = R * (1.5 + rnd()); p.x = cx + Math.cos(a) * rr * 4; p.y = cy + Math.sin(a) * rr * 4; p.vx = p.vy = 0; }
    const heat = 1 - Math.min(1, d / (W * .5)); ctx.fillStyle = `rgba(255,${160 + heat * 80},${110 + heat * 60},${.2 + .6 * heat})`; const sz = 1 + p.s + heat * 2; ctx.fillRect(p.x, p.y, sz, sz); }
  const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 5); gr.addColorStop(0, 'rgba(255,230,190,.95)'); gr.addColorStop(.12, 'rgba(255,190,130,.55)'); gr.addColorStop(1, 'rgba(255,150,100,0)'); ctx.fillStyle = gr; ctx.fillRect(cx - R * 5, cy - R * 5, R * 10, R * 10);
  vignette(.5);
}

// ───────── 장면 1: 일곱 살 — 풀밭, 연 ─────────
const kite = { x: 0, y: 0, vx: 0, vy: 0 };
function scene1(t, now) {
  const skyA = '#e9c9a6', skyB = '#c98a6a';
  paper(skyA, skyB);
  // 구름: 느린 타원 무리
  ctx.fillStyle = 'rgba(255,240,225,.55)'; for (let i = 0; i < 6; i++) { const x = ((i * 331 + now * 12) % (W + 300)) - 150, y = H * (.12 + (i % 3) * .08); for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.ellipse(x + k * 34 - 50, y + (k % 2) * 8, 46, 20, 0, 0, 6.28); ctx.fill(); } }
  // 해
  ctx.fillStyle = 'rgba(255,236,200,.9)'; ctx.beginPath(); ctx.arc(W * .78, H * .22, 26, 0, 6.28); ctx.fill();
  // 풀: 선 300개가 바람에 흔들린다
  const horizon = H * .62; const gr = ctx.createLinearGradient(0, horizon, 0, H); gr.addColorStop(0, '#6f8a46'); gr.addColorStop(1, '#2f4324'); ctx.fillStyle = gr; ctx.fillRect(0, horizon, W, H - horizon);
  ctx.lineWidth = 1.5; const n = W < 650 ? 160 : 320;
  for (let i = 0; i < n; i++) { const x = (i / n) * W + Math.sin(i * 7.1) * 6, base = horizon + (i * 37 % (H - horizon)), h = 18 + (i * 13 % 26) * (base - horizon) / (H - horizon) + 6; const sway = Math.sin(now * 1.7 + x * .02 + base * .01) * 7; ctx.strokeStyle = `rgba(${90 + (i % 5) * 18},${130 + (i % 7) * 12},60,.85)`; ctx.beginPath(); ctx.moveTo(x, base); ctx.quadraticCurveTo(x + sway * .5, base - h * .6, x + sway, base - h); ctx.stroke(); }
  // 연: 마우스를 늦게 따라가며 바람에 흔들린다. 줄은 아이 손(화면 아래)에서.
  const tx = clamp(mouse.x, 80, W - 80), ty = clamp(mouse.y, 60, horizon - 40);

  ctx.strokeStyle = '#c8402e'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 44); for (let k = 1; k <= 6; k++) ctx.lineTo(Math.sin(now * 6 + k) * 10 * k / 3, 44 + k * 14); ctx.stroke(); ctx.restore();

// ───────── 장면 2: 열일곱 — 비 오는 창, 손으로 닦은 자리 ─────────
const drops = []; let wipes = [];
function scene2(t, now) {

  // 바깥: 비 오는 밤의 도시 — 건물 실루엣 두 겹, 창 불빛, 가끔 번개
  const flash = Math.sin(now * .37) > .992 || Math.sin(now * .61 + 2) > .995;
  if (flash) { ctx.fillStyle = 'rgba(220,230,255,.55)'; ctx.fillRect(0, 0, W, H); }
  for (let L = 0; L < 2; L++) { const col = L === 0 ? 'rgba(24,32,46,1)' : 'rgba(12,16,26,1)'; let x = -20; let i = 0; while (x < W + 40) { const bw = 40 + ((i * 37 + L * 11) % 70), bh = H * (L === 0 ? .18 : .3) + ((i * 53) % (H * .22)); const y = H * .72 - bh + L * 40; ctx.fillStyle = col; ctx.fillRect(x, y, bw, bh + 200); if (L === 1) for (let wy = y + 10; wy < H * .7; wy += 14) for (let wx = x + 6; wx < x + bw - 8; wx += 12) { const on = Math.sin(i * 3.1 + wy * .13 + wx * .07) > .2; if (on) { ctx.fillStyle = flash ? 'rgba(255,240,220,.9)' : 'rgba(255,196,110,.75)'; ctx.fillRect(wx, wy, 5, 7); } } x += bw + 6 + (i % 3) * 8; i++; } }

// ───────── 장면 3: 스물넷 — 두 궤도 ─────────
const A = [], B = [];
function scene3(t, now) {
  ctx.fillStyle = 'rgba(26,16,22,.22)'; ctx.fillRect(0, 0, W, H);   // 잔상: 궤적이 남는다
  if (!A.length) for (let i = 0; i < 900; i++) { A.push({ a: rnd() * 6.28, r: 60 + rnd() * 90, s: .6 + rnd() * .8 }); B.push({ a: rnd() * 6.28, r: 60 + rnd() * 90, s: .6 + rnd() * .8 }); }
  const chosen = state.choices.love; const sep = chosen === 'a' ? lerp(.22, .08, clamp((now - (state.sceneEnter['choice:love'] || now) / 1000) * .5, 0, 1)) : chosen === 'b' ? lerp(.22, .42, clamp((now - (state.sceneEnter['choice:love'] || now) / 1000) * .5, 0, 1)) : .22;

// ───────── 장면 4: 서른하나 — 창문 하나 ─────────
let windows = null;
function scene4(t, now) {
  paper('#0a0d16', '#141a2a');
  const cols = W < 650 ? 18 : 44, rows = 16, cw = W / cols, rh = (H * .78) / rows, top = H * .12;
  if (!windows) { windows = []; for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) windows.push({ c, r, on: rnd() < .4, off: 2 + rnd() * 9, mine: r === 7 && c === Math.floor(cols / 2) }); }
  const chosen = state.choices.work;
  for (const w of windows) { const x = w.c * cw + 3, y = top + w.r * rh + 3; const late = ((now + w.c * 1.7 + w.r * 3.1) % 14) > w.off; let lit = w.on && !late; if (w.mine) lit = chosen === 'b' ? false : true; const hover = Math.abs(mouse.x - (x + cw / 2)) < cw / 2 && Math.abs(mouse.y - (y + rh / 2)) < rh / 2; if (hover && !w.mine) lit = !lit;

    if (w.mine) { ctx.strokeStyle = 'rgba(255,230,180,.9)'; ctx.lineWidth = 2; ctx.strokeRect(x - 2, y - 2, cw - 2, rh - 2); if (lit) { const gr = ctx.createRadialGradient(x + cw / 2, y + rh / 2, 4, x + cw / 2, y + rh / 2, cw * 2); gr.addColorStop(0, 'rgba(255,220,150,.35)'); gr.addColorStop(1, 'rgba(255,220,150,0)'); ctx.fillStyle = gr; ctx.fillRect(x - cw * 2, y - cw * 2, cw * 5, cw * 5); } } }
  ctx.fillStyle = 'rgba(239,230,214,.5)'; ctx.font = '12px ui-monospace, Menlo, monospace'; ctx.textAlign = 'center'; ctx.fillText('내 창', windows.find((w) => w.mine).c * cw + cw / 2, top + 8 * rh + 12); ctx.textAlign = 'left';
  vignette(.4);

// ───────── 장면 5: 마흔둘 — 빈자리, 내리는 것 ─────────
const ash = [];
function chair(x, y, s, col) { ctx.strokeStyle = col; ctx.lineWidth = 2 * s; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x - 20 * s, y); ctx.lineTo(x + 20 * s, y); ctx.moveTo(x - 18 * s, y); ctx.lineTo(x - 18 * s, y + 40 * s); ctx.moveTo(x + 18 * s, y); ctx.lineTo(x + 18 * s, y + 40 * s); ctx.moveTo(x - 18 * s, y); ctx.lineTo(x - 18 * s, y - 46 * s); ctx.lineTo(x + 18 * s, y - 46 * s); ctx.lineTo(x + 18 * s, y); ctx.moveTo(x - 18 * s, y - 30 * s); ctx.lineTo(x + 18 * s, y - 30 * s); ctx.stroke(); }
function scene5(t, now) {
  paper('#171615', '#0f0e0d');
  while (ash.length < (W < 650 ? 160 : 320)) ash.push({ x: Math.random() * W, y: Math.random() * H, v: .2 + Math.random() * .6, w: Math.random() * 6.28, r: .8 + Math.random() * 1.8 });
  for (const a of ash) { a.y += a.v; a.x += Math.sin(now * .8 + a.w) * .35; if (a.y > H) { a.y = -5; a.x = Math.random() * W; } ctx.fillStyle = `rgba(200,190,175,${.25 + .4 * Math.sin(a.w + now)})`; ctx.fillRect(a.x, a.y, a.r, a.r); }

  const s = W < 650 ? 1.2 : 1.8; const y = H * .76;
  if (state.choices.love === 'a') { chair(W / 2 - 70 * s, y, s, 'rgba(239,230,214,.85)'); chair(W / 2 + 70 * s, y, s, 'rgba(239,230,214,.18)'); }
  else { chair(W / 2, y, s, 'rgba(239,230,214,.85)'); ctx.fillStyle = 'rgba(239,230,214,.12)'; ctx.beginPath(); ctx.ellipse(W / 2 + 110 * s, y + 40 * s, 60 * s, 8 * s, 0, 0, 6.28); ctx.fill(); }

// ───────── 장면 6: 일흔 — 나무가 자란다 ─────────

function scene6(t, now) {
  paper('#e8dcc6', '#cbb79a');
  const healthy = state.choices.work === 'b'; const grow = ease(clamp(t * 1.3, 0, 1));
  const ground = H * .8;
  { const gr = ctx.createRadialGradient(W * .82, H * .2, 10, W * .82, H * .2, W * .5); gr.addColorStop(0, 'rgba(255,236,200,.75)'); gr.addColorStop(.12, 'rgba(255,220,170,.3)'); gr.addColorStop(1, 'rgba(255,220,170,0)'); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H); }

  if (healthy) for (let i = 0; i < 5; i++) { const x = (W * .2 + ((now * 28 + i * 160) % (W * .9))), y = H * .22 + Math.sin(now * .9 + i) * 18 + i * 14; ctx.strokeStyle = 'rgba(60,45,35,.8)'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x - 7, y); ctx.quadraticCurveTo(x - 3, y - 4 - Math.sin(now * 8 + i) * 3, x, y); ctx.quadraticCurveTo(x + 3, y - 4 - Math.sin(now * 8 + i) * 3, x + 7, y); ctx.stroke(); }

// ───────── 장면 7: 끝 — 모든 것이 한 장으로 ─────────
function scene7(t, now) {

  const cx = W / 2, cy = H * .5; const pulse = .5 + .5 * Math.sin(now * .9);

const DRAW = [scene0, scene1, scene2, scene3, scene4, scene5, scene6, scene7];

// ───────── 끝의 두 선택 ─────────
function elapsed() { return Math.round((Date.now() - state.began) / 1000); }
function returnToSystem() {
  state.ended = true; $('choices').classList.remove('show'); $('text').classList.remove('show'); $('sysT').textContent = `SYSTEM · 복귀 · 실행 #${run}`;
  store.run = run; try { localStorage.setItem('one-run', JSON.stringify(store)); } catch {}

  lines.push(
    `$ run --id ${run} --mode human`, `[ok] boot        age=0   light=1`, `[ok] childhood   age=7   kite.follow=mouse`, `[ok] window      age=17  wipes=${wipes.length}`,
    `[ok] orbit       age=24  choice=${state.choices.love === 'a' ? 'STAY' : state.choices.love === 'b' ? 'LEAVE' : 'none'}`,
    `[ok] window      age=31  choice=${state.choices.work === 'a' ? 'ALL_NIGHT' : state.choices.work === 'b' ? 'GO_HOME' : 'none'}`,
    `[ok] loss        age=42  chairs=${state.choices.love === 'a' ? 2 : 1}`, `[ok] garden      age=70  trees=${state.choices.work === 'b' ? 3 : 1}`,
    `[ok] end         age=84  elapsed=${elapsed()}s`, ``, `# 사람이었던 ${elapsed()}초가 로그 9줄로 남았다. 바이트로 ${new TextEncoder().encode(lines.slice(0, 9).join('\n')).length}.`, `# 삶은 저장되지 않았고, 로그만 남았다. 다시 실행할 수 있다.`, ``);

function stayHuman() {

  $('stayH').textContent = '여기 머물렀다.';
  $('stayP').textContent = `${store.lockedAt || ''}에 끝난 삶. 저장되지 않았고, 되돌릴 수 없다.\n새로고침해도 이 화면이다. 시스템은 문을 열어 둔다 — 그게 시스템이다.`;

}
$('back').onclick = () => { delete store.locked; delete store.lockedAt; try { localStorage.setItem('one-run', JSON.stringify(store)); } catch {} location.reload(); };

// ───────── 프레임 ─────────
let last = performance.now();
function frame(nowMs) {

addEventListener('resize', () => { build(); windows = null; });
build();
if (state.locked) showLock(); else setTimeout(() => $('hint').classList.add('show'), 200);
