<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>크레딧 — 말로만 본 창밖</title>
<style>
:root{--wall:#15120f;--ink:#ebe5d8;--dim:#9b9384;--lamp:#e9a03b;--line:#2c2620}
*{box-sizing:border-box;margin:0}
html{word-break:keep-all}
body{background:var(--wall);color:var(--ink);font:400 16px/1.7 "IBM Plex Sans KR",system-ui,sans-serif;padding:56px 64px;overflow-x:hidden}
main{max-width:640px}
h1{font:700 40px/1.2 "Gowun Batang",serif;margin:0 0 24px}
dl{display:grid;grid-template-columns:120px 1fr;border-top:1px solid var(--line)}
dt,dd{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
dt{color:var(--lamp)}
a{color:var(--lamp);text-decoration:none}
a:hover{text-decoration:underline}
nav{margin-top:28px;display:flex;gap:20px}
@media (max-width:760px){body{padding:24px 16px}dl{grid-template-columns:1fr}dt{border-bottom:0;padding-bottom:0}}
</style>
</head>
<body>
<main>
  <h1>크레딧</h1>
  <dl>
    <dt>서체</dt><dd>Gowun Batang · IBM Plex Sans KR — Google Fonts (SIL OFL 1.1)</dd>
    <dt>이미지</dt><dd>외부 이미지 없음. 창밖의 건물·사물은 전부 캔버스 2D로 그렸어요</dd>
    <dt>라이브러리</dt><dd>없음 (vanilla HTML/CSS/JS, 단일 파일)</dd>
    <dt>제작</dt><dd>Agent Office 디자인팀 (Pim · Tova · Remy · Noor)</dd>
    <dt>걸린 시간</dt><dd>20:18 시작 — 마감 기록은 하네스 로그 기준 (회의 시간 제외, 상한 1시간)</dd>
    <dt>토큰</dt><dd>하네스 집계값으로 채웁니다 (작업 중에는 확인할 수 없어요)</dd>
  </dl>
  <nav><a href="index.html">← 소개</a><a href="main.html">창 앞으로 →</a></nav>
</main>
</body>
</html>
