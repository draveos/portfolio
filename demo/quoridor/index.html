<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쿼리도 대국</title>
<meta name="description" content="쿼리도 보드게임을 브라우저 안에서 탐색 에이전트와 둡니다. 외부 의존 없이 순수 JS 로 동작합니다.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="play" id="app">
  <div class="board-col">
    <svg id="board" class="board" viewBox="0 0 456 456" role="group" aria-label="쿼리도 판" tabindex="-1">
      <g id="layer-cells"></g>
      <g id="layer-walls"></g>
      <g id="layer-moves"></g>
      <g id="layer-pawns"></g>
      <g id="layer-ghost" aria-hidden="true"></g>
      <g id="layer-fences"></g>
    </svg>
    <p class="sr-only" id="sr-state"></p>
  </div>
  <div class="side-col">
    <div class="scoreboard">
      <div class="who who-agent"><span class="pawn-dot" aria-hidden="true"></span><span class="who-name">에이전트</span><span class="walls" id="walls-agent">벽 10</span></div>
      <div class="who who-human"><span class="pawn-dot" aria-hidden="true"></span><span class="who-name">나</span><span class="walls" id="walls-human">벽 10</span></div>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="stats" id="stats" aria-live="off"></p>
    <div class="controls">
      <button type="button" id="fence-toggle" aria-pressed="false">벽 놓기 <kbd>F</kbd></button>
      <button type="button" id="orient-toggle" aria-pressed="false" disabled>가로 <kbd>R</kbd></button>
      <button type="button" id="restart">다시 시작</button>
      <label class="first-pick">선공
        <select id="first" aria-label="선공 선택">
          <option value="0">나</option>
          <option value="1">에이전트</option>
        </select>
      </label>
    </div>
    <p class="hint">말을 위쪽 끝줄까지 옮기면 이깁니다. 벽은 10장이고, 상대 길을 완전히 막는 자리에는 놓을 수 없습니다. 되돌리기는 없습니다.</p>
  </div>
  <div class="banner" id="banner" role="status" aria-live="assertive" hidden>
    <span id="banner-text"></span>
    <button type="button" id="banner-restart">다시 시작</button>
  </div>
</main>
<script src="rules.js"></script>
<script src="agent.js"></script>
<script src="ui.js"></script>
</body>
</html>
