<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#87CEEB" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ctext y=%2251%22 font-size=%2253%22%3E%F0%9F%8F%AF%3C/text%3E%3C/svg%3E" />
    <title>Voxel Pagoda Garden</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #87ceeb;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #overlay {
        position: fixed;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        color: #fff;
        font-family: "Segoe UI", sans-serif;
        font-size: 14px;
        font-weight: 400;
        background: rgba(0, 0, 0, 0.5);
        padding: 8px 20px;
        border-radius: 20px;
        pointer-events: none;
        z-index: 10;
        width: max-content;
        max-width: calc(100vw - 64px);
        text-align: center;
        line-height: 1.4;
      }
    </style>
    <script type="importmap">
      { "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <div id="overlay">🏯 Voxel Pagoda Garden — Drag to orbit, scroll to zoom</div>
    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

      // A full-window garden: its architecture and landscape are unit cubes.
      // Duplicate cells are averaged before 5-bit colour batching and instancing.
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87CEEB);
      scene.fog = new THREE.FogExp2(0xB0D4E8, 0.006);

      const camera = new THREE.PerspectiveCamera(
        55, window.innerWidth / window.innerHeight, 0.1, 500
      );
      camera.position.set(60, 50, 70);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      document.body.appendChild(renderer.domElement);
      renderer.domElement.setAttribute('aria-label', 'Interactive 3D voxel pagoda garden');

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 12, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.maxPolarAngle = Math.PI / 2.1;
      controls.minDistance = 20;
      controls.maxDistance = 150;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.5;

      scene.add(new THREE.AmbientLight(0x9DC4E0, 0.7));
      const sunlight = new THREE.DirectionalLight(0xFFF5E6, 1.8);
      sunlight.position.set(40, 60, 30);
      sunlight.castShadow = true;
      sunlight.shadow.mapSize.set(2048, 2048);
      sunlight.shadow.camera.left = -60;
      sunlight.shadow.camera.right = 60;
      sunlight.shadow.camera.top = 60;
      sunlight.shadow.camera.bottom = -60;
      sunlight.shadow.camera.near = 1;
      sunlight.shadow.camera.far = 150;
      sunlight.shadow.bias = -0.001;
      scene.add(sunlight);
      const fillLight = new THREE.DirectionalLight(0x8EC5FC, 0.4);
      fillLight.position.set(-30, 20, -20);
      scene.add(fillLight);
      scene.add(new THREE.HemisphereLight(0x87CEEB, 0x3A7D3A, 0.4));

      const C = {
        grass: 0x4A8C3F, darkGrass: 0x3D7A32, lightGrass: 0x5DA04E,
        dirt: 0x8B6914, sand: 0xC2A666, gravel: 0xA09070,
        waterDeep: 0x1A6B8A, waterShallow: 0x2E9ABF, waterEdge: 0x5BC0D4,
        lilyPad: 0x3D8B37, woodDark: 0x5C3317, woodMed: 0x8B5A2B,
        woodLight: 0xA67B4F, woodFloor: 0xC49A6C,
        pillarRed: 0xB22222, pillarDark: 0x8B1A1A,
        roofTile: 0x2C3E50, roofEdge: 0x34495E, roofAccent: 0x1ABC9C,
        gold: 0xDAA520, goldBright: 0xFFD700, goldDark: 0xB8860B,
        white: 0xF5F0E8, stoneGray: 0x95A5A6, stoneLight: 0xBDC3C7,
        stoneDark: 0x7F8C8D, pink1: 0xFFB7C5, pink2: 0xFF9BB5,
        pink3: 0xFFCDD2, pink4: 0xF8A5C2, petalWhite: 0xFFF0F5,
        petalPink: 0xFFD1DC, trunkBrown: 0x6B4226, trunkDark: 0x4A2E1A,
        leafGreen: 0x2D7A3A, leafLight: 0x4CAF50, leafDark: 0x1B5E20,
        bamboo: 0x6AAF5C, bambooJoint: 0x4A8F3C,
        lanternStone: 0x8899AA, lanternGlow: 0xFFEEBB,
        bridgeWood: 0x7B5B3A, bridgeRailing: 0x6B4226,
        flowerYellow: 0xFFEB3B, flowerPurple: 0x9C27B0, mossGreen: 0x558B2F,
      };

      const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
      const randInt = (a, b) => Math.floor(rand(a, b + 1));
      const pick = (arr) => arr[randInt(0, arr.length - 1)];
      const voxels = [];

      function addVoxel(x, y, z, color) {
        voxels.push({
          x: Math.round(x), y: Math.round(y), z: Math.round(z),
          c: new THREE.Color(color),
        });
      }

      // Terrain — four or fewer earth layers underneath each surface cell.
      function createTerrain() {
        for (let x = -56; x <= 56; x++) {
          for (let z = -56; z <= 56; z++) {
            let h = Math.sin(x * 0.04) * 2 + Math.cos(z * 0.05) * 1.5
              + Math.sin((x + z) * 0.03);
            const dist = Math.sqrt(x * x + z * z);
            if (dist < 20) h *= dist / 20;
            const y = Math.round(h);
            const color = dist < 14 && y <= 0
              ? pick([C.grass, C.lightGrass])
              : y < -1
                ? pick([C.darkGrass, C.mossGreen])
                : pick([C.grass, C.lightGrass, C.darkGrass]);
            addVoxel(x, y, z, color);
            for (let d = 1; d <= 3 && y - d >= -4; d++) {
              addVoxel(x, y - d, z, pick([C.dirt, C.darkGrass]));
            }
            if (((Math.abs(x) < 3 && z > 12 && z < 30)
              || (z === 0 && x > 14 && x < 35)) && Math.random() < 0.3) {
              addVoxel(x, y + 1, z, C.gravel);
            }
          }
        }
      }

      function createPond() {
        for (let x = -13; x <= 13; x++) {
          for (let z = -9; z <= 9; z++) {
            const ellipse = (x / 13) ** 2 + (z / 9) ** 2;
            if (ellipse >= 1) continue;
            const px = -25 + x;
            const pz = -18 + z;
            addVoxel(px, -2, pz, C.dirt);
            addVoxel(px, -3, pz, C.dirt);
            const depth = 1 - Math.sqrt(ellipse);
            addVoxel(px, -1, pz, depth > 0.3
              ? pick([C.waterDeep, C.waterShallow]) : C.waterEdge);
            if (ellipse > 0.75) addVoxel(px, 0, pz, pick([C.stoneGray, C.stoneDark]));
            if (depth > 0.3 && Math.random() < 0.04) {
              addVoxel(px, 0, pz, C.lilyPad);
              if (Math.random() < 0.3) addVoxel(px, 1, pz, pick([C.pink1, C.white]));
            }
          }
        }
        for (const [rx, rz] of [[5, -3], [-6, 4]]) {
          for (let dx = -1; dx <= 1; dx++) {
            for (let dz = -1; dz <= 1; dz++) {
              if (dx * dx + dz * dz <= 2) {
                addVoxel(-25 + rx + dx, 0, -18 + rz + dz,
                  pick([C.stoneGray, C.stoneDark, C.stoneLight]));
              }
            }
          }
        }
        for (let i = 0; i < 5; i++) {
          const x = -25 + 12 + i * 3;
          const z = -18 + randInt(-2, 2);
          addVoxel(x, -1, z, C.stoneGray);
          addVoxel(x, -2, z, C.dirt);
        }
      }

      function stoneLantern(x, y, z) {
        addVoxel(x, y, z, C.lanternStone);
        addVoxel(x, y - 1, z, C.stoneDark);
        addVoxel(x, y + 1, z, C.lanternStone);
        for (let dx = -1; dx <= 1; dx++) {
          for (let dz = -1; dz <= 1; dz++) {
            addVoxel(x + dx, y + 2, z + dz,
              dx === 0 && dz === 0 ? C.lanternGlow : C.lanternStone);
          }
        }
        for (let dx = -3; dx <= 3; dx++) {
          for (let dz = -3; dz <= 3; dz++) {
            if (Math.abs(dx) + Math.abs(dz) <= 3) {
              addVoxel(x + dx, y + 3, z + dz, C.stoneGray);
            }
          }
        }
        addVoxel(x, y + 4, z, C.goldDark);
      }

      function createPlatform() {
        for (let x = -10; x <= 10; x++) {
          for (let z = -10; z <= 10; z++) {
            addVoxel(x, 0, z, pick([C.stoneGray, C.stoneLight]));
            addVoxel(x, -1, z, C.stoneDark);
            addVoxel(x, -2, z, C.dirt);
          }
        }
        for (let x = -4; x <= 4; x++) {
          for (let s = 1; s <= 3; s++) addVoxel(x, -s, 10 + s, C.stoneLight);
        }
        for (const x of [-9, 9]) {
          for (const z of [-9, 9]) stoneLantern(x, 1, z);
        }
      }

      function createPagoda() {
        const tiers = [[8, 6], [7, 5], [6, 5], [5, 4], [4, 4]];
        let baseY = 1;
        let top = 0;
        tiers.forEach(([s, h], tier) => {
          for (let x = -s; x <= s; x++) {
            for (let z = -s; z <= s; z++) addVoxel(x, baseY, z, C.woodFloor);
          }
          for (let dy = 1; dy <= h; dy++) {
            for (let x = -s; x <= s; x++) {
              for (let z = -s; z <= s; z++) {
                const edgeX = Math.abs(x) === s;
                const edgeZ = Math.abs(z) === s;
                if (!edgeX && !edgeZ) continue;
                const corner = edgeX && edgeZ;
                const isPillar = (edgeX && z % 3 === 0) || (edgeZ && x % 3 === 0);
                if (tier === 0 && edgeZ && Math.abs(x) < 2) {
                  if (dy === h) addVoxel(x, baseY + dy, z, C.pillarDark);
                } else if (corner || isPillar) {
                  addVoxel(x, baseY + dy, z, C.pillarRed);
                } else {
                  addVoxel(x, baseY + dy, z, dy === h
                    ? C.woodLight : pick([C.woodMed, C.woodLight]));
                }
              }
            }
          }

          for (let r = 0; r < 3; r++) {
            const rs = s + Math.round(Math.max(2 - 0.5 * r, 0)) + 1;
            const y = baseY + h + 1 + r;
            for (let x = -rs; x <= rs; x++) {
              for (let z = -rs; z <= rs; z++) {
                const edgeX = Math.abs(x) === rs;
                const edgeZ = Math.abs(z) === rs;
                if (edgeX || edgeZ) {
                  if (edgeX && edgeZ) {
                    addVoxel(x, y, z, C.roofAccent);
                    if (r === 2) {
                      addVoxel(x, y + 1, z, C.goldBright);
                      addVoxel(x, y + 2, z, C.gold);
                    }
                  } else {
                    addVoxel(x, y, z, r === 2
                      ? pick([C.roofAccent, C.roofTile])
                      : pick([C.roofTile, C.roofEdge]));
                  }
                } else if (r < 2 && (Math.abs(x) === rs - 1 || Math.abs(z) === rs - 1)
                  && Math.random() < 0.3) {
                  addVoxel(x, y, z, C.roofTile);
                }
              }
            }
          }
          top = baseY + h + 3;
          for (let x = -s - 1; x <= s + 1; x++) {
            for (let z = -s - 1; z <= s + 1; z++) addVoxel(x, top, z, C.roofTile);
          }
          if (tier === 0) {
            for (let x = -s; x <= s; x++) {
              for (let z = -s; z <= s; z++) {
                if ((Math.abs(x) === s || Math.abs(z) === s)
                  && !(Math.abs(z) === s && Math.abs(x) < 2)) {
                  addVoxel(x, baseY + h + 1, z, C.woodLight);
                }
              }
            }
            for (let dy = 1; dy <= 2; dy++) addVoxel(0, baseY + dy, s - 1, C.lanternGlow);
          }
          if (tier < tiers.length - 1) {
            for (const sx of [-1, 1]) {
              for (const sz of [-1, 1]) {
                addVoxel(sx * (s + rand(-0.3, 0.3)), baseY + h + 1,
                  sz * (s + rand(-0.3, 0.3)), C.gold);
              }
            }
          }
          // The next floor sits three cells above this tier's wall top.
          baseY = baseY + h + 3;
        });
        for (let i = 0; i < 8; i++) {
          addVoxel(0, top + i, 0, pick([C.goldBright, C.gold]));
          if (i % 2 === 1) {
            for (let dx = -2; dx <= 2; dx++) {
              for (let dz = -2; dz <= 2; dz++) {
                if (Math.abs(dx) + Math.abs(dz) <= 2 && (dx !== 0 || dz !== 0)) {
                  addVoxel(dx, top + i, dz, C.gold);
                }
              }
            }
          }
        }
        addVoxel(0, top + 8, 0, C.pink1);
        addVoxel(0, top + 9, 0, C.goldBright);
      }

      function createBridge() {
        for (let i = 0; i <= 11; i++) {
          const bx = -15 + i;
          const bz = -18;
          const archH = Math.round(Math.sin((i / 11) * Math.PI) * 3);
          addVoxel(bx, -1 + archH, bz, C.bridgeWood);
          addVoxel(bx, -2 + archH, bz, C.bridgeWood);
          for (const z of [bz - 1, bz + 1]) {
            if (i % 2 === 0) {
              addVoxel(bx, archH, z, C.bridgeRailing);
              addVoxel(bx, archH + 1, z, C.bridgeRailing);
            }
            if (i > 0 && i < 11) addVoxel(bx, archH + 1, z, C.bridgeWood);
          }
          if (i === 0 || i === 11) {
            for (let d = 0; d <= 2; d++) addVoxel(bx, -2 - d, bz, C.stoneGray);
          }
        }
      }

      function createPaths() {
        for (let z = 30; z >= 12; z--) {
          for (let x = -2; x <= 2; x++) {
            const px = Math.round(x + Math.sin(z * 0.2) * 1.5);
            if (Math.random() < 0.7) addVoxel(px, 1, z, pick([C.stoneLight, C.gravel, C.sand]));
          }
        }
        for (let x = -5; x >= -20; x--) {
          const pz = Math.round(8 + Math.cos(x * 0.15));
          if (Math.random() < 0.6) addVoxel(x, 1, pz, pick([C.stoneLight, C.gravel]));
        }
        for (let a = 0; a < Math.PI * 2; a += 0.15) {
          const r = 13 + Math.sin(a * 3);
          if (Math.random() < 0.5) {
            addVoxel(Math.round(Math.cos(a) * r), 1, Math.round(Math.sin(a) * r),
              pick([C.gravel, C.stoneLight]));
          }
        }
        stoneLantern(-4, 1, 22);
        stoneLantern(4, 1, 22);
        stoneLantern(-5, 1, 16);
        stoneLantern(5, 1, 16);
      }

      function blossomCluster(cx, cy, cz, radius) {
        for (let x = -radius; x <= radius; x++) {
          for (let y = -radius; y <= radius; y++) {
            for (let z = -radius; z <= radius; z++) {
              if (x * x + y * y + z * z < radius * radius && Math.random() < 0.65) {
                addVoxel(cx + x, cy + y, cz + z, pick([C.pink1, C.pink2, C.pink3, C.petalWhite]));
              }
            }
          }
        }
      }

      function cherryTree(x, z, h) {
        const groundY = 1;
        const trunk = [];
        let tx = x;
        let tz = z;
        for (let dy = 0; dy < h; dy++) {
          if (dy > 1 && Math.random() < 0.3) {
            tx += pick([-1, 0, 1]);
            tz += pick([-1, 0, 1]);
          }
          const y = groundY + dy;
          addVoxel(tx, y, tz, pick([C.trunkBrown, C.trunkDark]));
          if (dy < 2) {
            for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
              addVoxel(tx + dx, y, tz + dz, pick([C.trunkBrown, C.trunkDark]));
            }
          }
          trunk.push([tx, y, tz]);
        }
        const branches = randInt(4, 7);
        for (let b = 0; b < branches; b++) {
          const angle = (b / branches) * Math.PI * 2 + rand(-0.3, 0.3);
          const length = randInt(2, 5);
          const [rootX, rootY, rootZ] = trunk[randInt(Math.floor(h * 0.5), h - 1)];
          let bx = rootX;
          let by = rootY;
          let bz = rootZ;
          for (let step = 1; step <= length; step++) {
            bx = Math.round(rootX + Math.cos(angle) * step);
            bz = Math.round(rootZ + Math.sin(angle) * step);
            if (Math.random() < 0.3) by++;
            addVoxel(bx, by, bz, pick([C.trunkBrown, C.trunkDark]));
          }
          blossomCluster(bx, by, bz, randInt(2, 4));
        }
        const r = randInt(3, 5);
        const cy = groundY + h;
        const blossomColors = [C.pink1, C.pink2, C.pink3, C.pink4, C.petalWhite, C.petalPink];
        for (let dx = -r; dx <= r; dx++) {
          for (let dy = -Math.ceil(r / 2); dy <= Math.ceil(r / 2); dy++) {
            for (let dz = -r; dz <= r; dz++) {
              const dist = Math.sqrt(dx * dx + (2 * dy) ** 2 + dz * dz);
              if (dist >= r) continue;
              const chance = dist < r * 0.5 ? 1 : dist > r * 0.8 ? 0.6 : 0.7;
              if (Math.random() < chance) {
                addVoxel(tx + dx, cy + dy, tz + dz, pick(blossomColors));
                if (Math.random() < 0.05) {
                  const [lx, ly, lz] = pick([[1, 0, 0], [-1, 0, 0], [0, 1, 0], [0, 0, 1], [0, 0, -1]]);
                  addVoxel(tx + dx + lx, cy + dy + ly, tz + dz + lz, C.leafLight);
                }
              }
            }
          }
        }
        for (let i = 0; i < 8; i++) {
          addVoxel(x + randInt(-5, 5), groundY, z + randInt(-5, 5),
            pick([C.pink1, C.petalPink, C.petalWhite]));
        }
        for (let dx = -3; dx <= 3; dx++) {
          for (let dz = -3; dz <= 3; dz++) {
            if (dx * dx + dz * dz < 9 && Math.random() < 0.2) {
              addVoxel(x + dx, groundY, z + dz, pick([C.pink1, C.petalPink, C.petalWhite]));
            }
          }
        }
      }

      function createCherryTrees() {
        for (const [x, z, h] of [
          [18, -15, 7], [-12, 20, 6], [25, 10, 8],
          [-30, 5, 7], [15, 25, 6], [-20, -30, 8],
        ]) cherryTree(x, z, h);
      }

      function pineTree(x, z) {
        const h = randInt(6, 10);
        const layers = randInt(4, 6);
        for (let dy = 0; dy < h; dy++) addVoxel(x, 1 + dy, z, pick([C.trunkBrown, C.trunkDark]));
        const top = 1 + h;
        for (let l = 0; l < layers; l++) {
          const layerR = Math.round(layers - l * 0.8);
          for (let dx = -layerR - 1; dx <= layerR + 1; dx++) {
            for (let dz = -layerR - 1; dz <= layerR + 1; dz++) {
              if (Math.abs(dx) + Math.abs(dz) <= layerR + 1 && Math.random() < 0.8) {
                addVoxel(x + dx, top + l, z + dz, pick([C.leafDark, C.leafGreen]));
              }
            }
          }
        }
        addVoxel(x, top + layers, z, C.leafDark);
      }

      function roundTree(x, z) {
        const h = randInt(6, 9);
        const r = randInt(3, 4);
        for (let dy = 0; dy < h; dy++) {
          addVoxel(x, 1 + dy, z, C.trunkBrown);
          if (dy < 3) {
            for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
              addVoxel(x + dx, 1 + dy, z + dz, pick([C.trunkBrown, C.trunkDark]));
            }
          }
        }
        for (let dx = -r; dx <= r; dx++) {
          for (let dy = -r; dy <= r; dy++) {
            for (let dz = -r; dz <= r; dz++) {
              if (dx * dx + dy * dy + dz * dz < r * r && Math.random() < 0.75) {
                addVoxel(x + dx, 1 + h + dy, z + dz, pick([C.leafGreen, C.leafLight, C.leafDark]));
              }
            }
          }
        }
      }

      function bambooGrove(x, z) {
        const stalks = randInt(3, 6);
        let bx = x;
        let bz = z;
        for (let stalk = 0; stalk < stalks; stalk++) {
          bx += randInt(-2, 2);
          bz += randInt(-2, 2);
          const height = randInt(8, 14);
          for (let dy = 0; dy < height; dy++) {
            const joint = (dy + 1) % 3 === 0;
            addVoxel(bx, 1 + dy, bz, joint ? C.bambooJoint : C.bamboo);
            if (joint && Math.random() < 0.5) {
              const [dx, dz] = pick([[1, 0], [-1, 0], [0, 1], [0, -1]]);
              addVoxel(bx + dx, 1 + dy, bz + dz, C.leafLight);
            }
          }
        }
      }

      function createGreenTrees() {
        for (const [x, z] of [[-40, -35], [-42, 10], [-38, 30], [-28, -40]]) pineTree(x, z);
        for (const [x, z] of [[35, -30], [40, 20], [38, -15], [30, 35]]) roundTree(x, z);
        bambooGrove(28, -25);
        bambooGrove(-35, 20);
      }

      function rock(x, baseY, z, size) {
        const tops = new Map();
        for (let dx = -size; dx <= size; dx++) {
          for (let dy = 0; dy <= size; dy++) {
            for (let dz = -size; dz <= size; dz++) {
              const dist = Math.sqrt(dx * dx + (dy * 1.5) ** 2 + dz * dz);
              if (dist < size && Math.random() < 0.7) {
                addVoxel(x + dx, baseY + dy, z + dz, pick([C.stoneGray, C.stoneDark, C.stoneLight]));
                const key = dx + ',' + dz;
                if (!tops.has(key) || tops.get(key).y < dy) tops.set(key, {x: dx, y: dy, z: dz});
              }
            }
          }
        }
        for (const point of tops.values()) {
          if (point.y >= Math.floor(size * 0.4) && Math.random() < 0.3) {
            addVoxel(x + point.x, baseY + point.y + 1, z + point.z, C.mossGreen);
          }
        }
      }

      function flowerPatch(x, y, z, r) {
        for (let i = 0; i < r * 4; i++) {
          const angle = rand(0, Math.PI * 2);
          const distance = Math.sqrt(Math.random()) * r;
          const fx = x + Math.round(Math.cos(angle) * distance);
          const fz = z + Math.round(Math.sin(angle) * distance);
          addVoxel(fx, y + 1, fz, C.leafGreen);
          const colors = pick([
            [C.pink1, C.flowerYellow, C.white, C.flowerPurple],
            [C.pink3, C.petalWhite, C.pink4],
          ]);
          addVoxel(fx, y + 2, fz, pick(colors));
        }
        for (let b = 0; b < 3; b++) {
          const bx = x + randInt(-r, r);
          const bz = z + randInt(-r, r);
          for (let dx = -1; dx <= 1; dx++) {
            for (let dz = -1; dz <= 1; dz++) {
              if (Math.abs(dx) + Math.abs(dz) <= 1) {
                addVoxel(bx + dx, y + 1, bz + dz, pick([C.leafGreen, C.leafLight]));
              }
            }
          }
          addVoxel(bx, y + 2, bz, C.leafGreen);
        }
      }

      function createGardenDetails() {
        for (const [x, z, size] of [[-8, 15, 3], [12, -8, 2], [-22, 12, 4], [20, 18, 2], [-18, -10, 3]]) {
          rock(x, 0, z, size);
        }
        flowerPatch(10, 1, 15, 3);
        flowerPatch(-15, 1, 10, 2);
        flowerPatch(8, 1, -12, 3);
        // A red gate on the main approach.
        const y = 1;
        for (const x of [-3, 3]) {
          addVoxel(x, 0, 28, C.stoneGray);
          for (let dy = 0; dy < 7; dy++) addVoxel(x, y + dy, 28, C.pillarRed);
        }
        for (let x = -4; x <= 4; x++) addVoxel(x, y + 6, 28, C.pillarRed);
        for (let x = -5; x <= 5; x++) {
          addVoxel(x, y + 7 + (Math.abs(x) > 3 ? 1 : 0), 28, C.pillarDark);
        }
        addVoxel(0, y + 8, 28, C.goldBright);
        addVoxel(-25, -1, -18, C.stoneGray);
        addVoxel(-25, 0, -18, C.stoneLight);
        addVoxel(-25, 1, -18, C.waterEdge);
      }

      function buildScene() {
        createTerrain();
        createPond();
        createPlatform();
        createPagoda();
        createBridge();
        createPaths();
        createCherryTrees();
        createGreenTrees();
        createGardenDetails();

        // First merge shared integer cells. No hidden duplicate cubes or z-fighting.
        const merged = new Map();
        for (const voxel of voxels) {
          const key = voxel.x + ',' + voxel.y + ',' + voxel.z;
          const cell = merged.get(key);
          if (cell) {
            cell.c.add(voxel.c);
            cell.count++;
          } else {
            merged.set(key, {...voxel, c: voxel.c.clone(), count: 1});
          }
        }
        const q = (v) => Math.round(v * 31) / 31;
        const groups = new Map();
        for (const cell of merged.values()) {
          cell.c.multiplyScalar(1 / cell.count);
          const r = q(cell.c.r);
          const g = q(cell.c.g);
          const b = q(cell.c.b);
          const key = r + ',' + g + ',' + b;
          if (!groups.has(key)) groups.set(key, {color: new THREE.Color().setRGB(r, g, b), cells: []});
          groups.get(key).cells.push(cell);
        }
        const geometry = new THREE.BoxGeometry(0.98, 0.98, 0.98);
        const dummy = new THREE.Object3D();
        for (const group of groups.values()) {
          const material = new THREE.MeshStandardMaterial({roughness: 0.75, metalness: 0.05});
          material.color.copy(group.color);
          const mesh = new THREE.InstancedMesh(geometry, material, group.cells.length);
          mesh.castShadow = mesh.receiveShadow = true;
          group.cells.forEach((cell, i) => {
            dummy.position.set(cell.x, cell.y, cell.z);
            dummy.updateMatrix();
            mesh.setMatrixAt(i, dummy.matrix);
          });
          mesh.instanceMatrix.needsUpdate = true;
          mesh.computeBoundingSphere();
          scene.add(mesh);
        }
        renderer.domElement.dataset.voxelCount = String(merged.size);
        renderer.domElement.dataset.colorGroups = String(groups.size);
        voxels.length = 0;
      }

      // Petals use a single dynamic instance buffer, not 200 individual meshes.
      const petalCount = 200;
      const petals = new THREE.InstancedMesh(
        new THREE.BoxGeometry(0.3, 0.1, 0.3),
        new THREE.MeshStandardMaterial({roughness: 0.5}),
        petalCount
      );
      petals.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      petals.frustumCulled = false;
      const petalData = [];
      for (let i = 0; i < petalCount; i++) {
        petalData.push({
          x: rand(-40, 40), y: rand(5, 35), z: rand(-40, 40),
          speedX: rand(-0.02, 0.02), speedZ: rand(-0.02, 0.02),
          speedY: rand(-0.01, -0.03), rotSpeed: rand(0.01, 0.05),
          color: new THREE.Color(pick([C.pink1, C.pink2, C.petalWhite, C.pink4])),
        });
        petals.setColorAt(i, petalData[i].color);
      }
      scene.add(petals);
      const petalDummy = new THREE.Object3D();
      function updatePetals(t) {
        for (let i = 0; i < petalCount; i++) {
          const p = petalData[i];
          p.x += p.speedX + Math.sin(t * 0.5 + i) * 0.01;
          p.y += p.speedY;
          p.z += p.speedZ + Math.cos(t * 0.3 + i) * 0.01;
          if (p.y < -2) p.y = rand(30, 45);
          petalDummy.position.set(p.x, p.y, p.z);
          petalDummy.rotation.set(t * p.rotSpeed, t * p.rotSpeed * 1.3, 0);
          petalDummy.updateMatrix();
          petals.setMatrixAt(i, petalDummy.matrix);
          petals.setColorAt(i, p.color);
        }
        petals.instanceMatrix.needsUpdate = true;
        petals.instanceColor.needsUpdate = true;
      }

      const clouds = new THREE.Group();
      function createClouds() {
        const geometry = new THREE.BoxGeometry(0.98, 0.98, 0.98);
        const material = new THREE.MeshStandardMaterial({color: 0xF5F0E8, roughness: 0.75});
        const dummy = new THREE.Object3D();
        for (let cloud = 0; cloud < 6; cloud++) {
          const cx = rand(-50, 50);
          const cy = rand(40, 55);
          const cz = rand(-50, 50);
          const size = randInt(3, 6);
          const positions = [];
          for (let x = -size; x <= size; x++) {
            for (let y = -Math.ceil(size / 3); y <= Math.ceil(size / 3); y++) {
              for (let z = -size; z <= size; z++) {
                const dist = Math.sqrt(x * x + (3 * y) ** 2 + z * z);
                if (dist < size && Math.random() < 0.7) positions.push([x, y, z]);
              }
            }
          }
          const mesh = new THREE.InstancedMesh(geometry, material, positions.length);
          mesh.position.set(cx, cy, cz);
          positions.forEach(([x, y, z], i) => {
            dummy.position.set(x, y, z);
            dummy.updateMatrix();
            mesh.setMatrixAt(i, dummy.matrix);
          });
          mesh.instanceMatrix.needsUpdate = true;
          mesh.computeBoundingSphere();
          clouds.add(mesh);
        }
        scene.add(clouds);
      }

      buildScene();
      createClouds();
      window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        updatePetals(t);
        clouds.position.x += 0.005;
        if (clouds.position.x > 20) clouds.position.x = -20;
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
